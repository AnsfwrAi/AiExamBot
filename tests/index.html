<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Выбор теста | Экзамены</title>
  <style>
    body {
      font-family: Segoe UI, Arial, sans-serif;
      background: #f2f3f5;
      margin:0;
      color: #333;
    }
    .topbar {
      width: 100vw;
      min-width: 100%;
      background: #edeff2;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      border-bottom: 1.5px solid #d4dae2;
      box-sizing: border-box;
      position: sticky;
      top: 0;
      z-index: 999;
      box-shadow: 0 2px 10px #0001;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .logo {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1.5px 6px #0001;
      overflow: hidden;
      border: 1.5px solid #c9d3de;
    }
    .logo-img {
      width: 34px; height: 34px;
      display: block;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .topbar-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      margin-right: 16px;
      font-size: 17px;
      color: #7c7e83;
      font-weight: 500;
    }
    .meta-label {
      font-size: 13px;
      color: #979ba4;
      font-weight: 400;
      margin-bottom: -1.5px;
      letter-spacing: .02em;
    }
    .meta-value {
      color: #222;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: .03em;
    }
    .avatar {
      width: 39px; height: 39px;
      border-radius: 50%;
      background: #e5e8ec;
      border: 1.5px solid #d4dae2;
      margin-left: 13px;
      display: flex; align-items: center; justify-content: center;
      color: #7a92b6;
      font-size: 24px;
      font-weight: 600;
      cursor: pointer;
      overflow: hidden;
    }
    .avatar svg {
      width: 28px; height: 28px;
    }
    .container {
      width: 100%;
      max-width: 660px;
      margin: 48px auto 0 auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 3px 16px #0001;
      padding: 42px 30px 42px 30px;
      min-height: 67vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .menu-title {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 18px;
      color: #2365a8;
      letter-spacing: .02em;
      text-align: center;
    }
    .test-list {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      margin-top: 16px;
    }
    .test-card {
      background: #f8fafd;
      border: 1.5px solid #d8e4f2;
      border-radius: 12px;
      box-shadow: 0 2px 7px #0001;
      padding: 24px 26px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      transition: box-shadow 0.16s, border 0.16s;
      cursor: pointer;
      position: relative;
      text-decoration: none;
      color: inherit;
    }
    .test-card:hover {
      border: 1.5px solid #38a1f7;
      box-shadow: 0 4px 15px #38a1f72c;
      background: #f2f9ff;
    }
    .test-name {
      font-size: 21px;
      font-weight: 500;
      color: #19588c;
    }
    .test-meta {
      font-size: 16px;
      color: #6a7a96;
      display: flex;
      gap: 22px;
      margin-top: 2px;
    }
    .arrow-right {
      position: absolute;
      right: 22px;
      top: 50%;
      transform: translateY(-50%);
      color: #4094de;
      opacity: 0.65;
      font-size: 23px;
      pointer-events: none;
    }
    @media (max-width: 800px){
      .container {max-width:100vw; border-radius:0; padding: 14px;}
    }
    @media (max-width: 600px){
      .container {padding:8px;}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo">
        <svg class="logo-img" viewBox="0 0 64 64" fill="none">
          <ellipse cx="32" cy="18" rx="25" ry="9" stroke="#597bbd" stroke-width="2" fill="#fff"/>
          <rect x="12" y="27" width="6" height="22" rx="2" fill="#c7d7eb"/>
          <rect x="46" y="27" width="6" height="22" rx="2" fill="#c7d7eb"/>
          <rect x="29" y="27" width="6" height="22" rx="2" fill="#c7d7eb"/>
          <rect x="38" y="27" width="6" height="22" rx="2" fill="#c7d7eb"/>
          <rect x="21" y="27" width="6" height="22" rx="2" fill="#c7d7eb"/>
          <rect x="8" y="51" width="48" height="5" rx="2" fill="#b7c3d4"/>
        </svg>
      </div>
    </div>
    <div class="topbar-right">
      <div class="topbar-meta">
        <span class="meta-label">Server vaqti</span>
        <span class="meta-value" id="serverTime">--.--.---- | --:--</span>
      </div>
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="8" r="5" stroke="#7a92b6" stroke-width="2"/>
          <path d="M2 22c2-5.5 10-5.5 20 0" stroke="#7a92b6" stroke-width="2" fill="none"/>
        </svg>
      </div>
    </div>
  </div>
  <div class="container">
    <div class="menu-title">Выберите тест для прохождения</div>
    <div class="test-list">
      <a href="/exm2.html" class="test-card">
        <div class="test-name">Экзамен по математике</div>
        <div class="test-meta">
          <span>Математика</span>
          <span>Evgeniy Tulagenov Maksimovich</span>
        </div>
        <span class="arrow-right">&#8594;</span>
      </a>
      <a href="/exm1.html" class="test-card">
        <div class="test-name">Экзамен по организации компьютера</div>
        <div class="test-meta">
          <span>Организация компьютера</span>
          <span>Evgeniy Tulagenov Maksimovich</span>
        </div>
        <span class="arrow-right">&#8594;</span>
      </a>
    </div>
  </div>
  <script>
    function updateServerTime() {
      let dt = new Date();
      let d = String(dt.getDate()).padStart(2, '0');
      let m = String(dt.getMonth()+1).padStart(2, '0');
      let y = dt.getFullYear();
      let hh = String(dt.getHours()).padStart(2, '0');
      let mm = String(dt.getMinutes()).padStart(2, '0');
      document.getElementById('serverTime').textContent = `${d}.${m}.${y} | ${hh}:${mm}`;
    }
    updateServerTime();
    setInterval(updateServerTime, 30000);
  </script>
</body>
</html>
