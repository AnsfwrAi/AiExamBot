
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types application/javascript text/javascript application/json text/css;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    map $ssl_preread_server_name $rdp_backend {
        turn.bestquiz.uz  turn_upstream;
        default           web_upstream;
    }

    upstream web_upstream {
        server 127.0.0.1:8443;
    }

    upstream turn_upstream {
        server 172.17.0.1:5349;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $rdp_backend;
        proxy_timeout 3600s;
    }
}
